<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French Lab">
  <meta name="description" content="フランス語の文構造、時制・法、動詞活用、復習を一つの場所で学ぶアプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>French Structure Lab</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand-area">
        <div class="brand-symbol" aria-hidden="true">fr<span>.</span></div>
        <div class="brand-title"><strong>French Structure Lab</strong><span>Understand how French works.</span></div>
      </div>
      <div class="header-actions">
        <label class="header-level" for="levelSelect">LEVEL <select id="levelSelect" aria-label="学習レベル"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label>
        <span id="savedStatus" class="saved-status" aria-live="polite">● ローカル保存</span>
        <button id="fontSizeButton" class="language-btn" type="button" aria-label="文字サイズ切替" aria-pressed="false">A＋</button>
        <button id="languageButton" class="language-btn" type="button" aria-label="Switch explanation language">EN / 日本語</button>
      </div>
    </header>

    <section class="hero" aria-label="Study dashboard">
      <div class="hero-copy">
        <span id="heroEyebrow" class="eyebrow">FRENCH STUDY • A1〜C2 / 仏検4級〜1級</span>
        <h1 id="heroTitle">単語の意味から、<br>文のしくみへ。</h1>
        <p id="heroDescription">問題を解く。間違いを理解する。構造を見直す。<br class="wide-only">毎日10〜15分から始めるフランス語。</p>
      </div>
      <div class="hero-numbers" aria-label="Study progress">
        <div><strong id="statAnswered">0</strong><span id="statAnsweredLabel">解答した問題</span></div>
        <div><strong id="statDue">0</strong><span id="statDueLabel">今日の復習</span></div>
        <div><strong id="statStreak">0</strong><span id="statStreakLabel">連続学習日</span></div>
      </div>
    </section>

    <div class="quick-info" id="quickInfo" aria-live="polite">B1</div>
    <nav class="main-nav" aria-label="Main navigation" id="nav">
      <button class="nav-tab" data-view="courses"><span class="tab-icon">▦</span><span data-ja="A1〜C2教材" data-en="Courses">A1〜C2教材</span></button>
      <button class="nav-tab active" data-view="today"><span class="tab-icon">✦</span><span data-ja="今日の練習" data-en="Practice">今日の練習</span></button>
      <a class="exam-nav" href="./exam.html"><span class="tab-icon">✍</span><span>仏検対策</span></a>
      <a class="exam-nav" href="./cognition.html"><span class="tab-icon">◈</span><span>認知と文法</span></a>
      <button class="nav-tab" data-view="analysis"><span class="tab-icon">⌁</span><span data-ja="文章分析" data-en="Sentence Lab">文章分析</span></button>
      <button class="nav-tab" data-view="verbs"><span class="tab-icon">◇</span><span data-ja="動詞と構造" data-en="Verb Lab">動詞と構造</span></button>
      <button class="nav-tab" data-view="review"><span class="tab-icon">↺</span><span data-ja="復習" data-en="Review">復習</span></button>
      <button class="nav-tab" data-view="records"><span class="tab-icon">▤</span><span data-ja="学習記録" data-en="Ledger">学習記録</span></button>
      <button class="nav-tab" data-view="library"><span class="tab-icon">＋</span><span data-ja="教材・データ" data-en="Library">教材・データ</span></button>
    </nav>

    <main id="content" tabindex="-1" aria-live="polite"></main>
    <footer class="footer">French Structure Lab <span>v0.7.0</span> · Your learning data stays in this browser. · No account required.</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./data.js" defer></script>
  <script src="./curriculum.js" defer></script>
  <script src="./learning-insights.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
